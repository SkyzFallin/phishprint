[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishprint"
version = "0.1.0"
description = "Pre-engagement email security reconnaissance for offensive security operators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SkyzFallin" }]
keywords = ["security", "phishing", "recon", "spf", "dmarc", "dkim", "redteam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "dnspython>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
phishprint = "phishprint.cli:app"

[project.urls]
Homepage = "https://github.com/SkyzFallin/phishprint"
Issues = "https://github.com/SkyzFallin/phishprint/issues"

[tool.setuptools.packages.find]
include = ["phishprint*"]

[tool.setuptools.package-data]
phishprint = ["data/*.txt", "fingerprint/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
