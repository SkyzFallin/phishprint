<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="760" height="180" fill="url(#bg)"/>

  <!-- text block -->
  <text x="40" y="84"
        font-family="Courier New, Courier, monospace"
        font-size="56"
        font-weight="bold"
        fill="#c9d1d9">phishprint</text>
  <text x="40" y="124"
        font-family="Courier New, Courier, monospace"
        font-size="18"
        fill="#8b949e">pre-engagement email security recon</text>
  <text x="40" y="152"
        font-family="Courier New, Courier, monospace"
        font-size="14"
        fill="#58a6ff">SPF // DKIM // DMARC // vendor fingerprint // readiness score</text>

  <!-- right-side graphic: envelope pierced by a fishhook -->
  <g stroke="#58a6ff" stroke-width="2" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- envelope body -->
    <rect x="585" y="65" width="140" height="85" rx="3"/>
    <!-- envelope flap -->
    <polyline points="585,65 655,118 725,65"/>
    <!-- fishhook shaft entering through the flap -->
    <path d="M 655 22 L 655 118"/>
    <!-- hook curve below envelope -->
    <path d="M 655 118 Q 655 152 628 152 Q 605 152 605 130"/>
    <!-- barb -->
    <path d="M 605 130 L 615 138" />
    <path d="M 605 130 L 612 121" />
    <!-- hook eye (small loop at top of shaft) -->
    <circle cx="655" cy="18" r="4"/>
  </g>

  <!-- bottom accent line -->
  <line x1="0" y1="170" x2="760" y2="170" stroke="#58a6ff" stroke-width="1"/>
</svg>
